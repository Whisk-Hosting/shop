{{- $p := .Data -}}
<div class="narrow">
  <h1>{{if $p.Token}}New password{{else}}Set a password{{end}}</h1>
  {{with $p.Failed}}<p class="notice error" role="alert">{{.}}</p>{{end}}
  {{if $p.Sent}}
  <p class="notice">Check your email for the link.</p>
  {{else if $p.Token}}
  <form method="post" action="/account/password/set">
    <input type="hidden" name="token" value="{{$p.Token}}">
    <input type="hidden" name="email" value="{{$p.Email}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{$p.MinPassword}}" required autofocus>
    <p></p>
    <button class="wide" type="submit">Save and sign in</button>
  </form>
  {{else}}
  <form method="post" action="/account/password/request">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{$p.Email}}">
    <p></p>
    <button class="wide" type="submit">Email me a link</button>
  </form>
  {{end}}
</div>
