whisk: 1
name: whisk-shop

# The shop has its own sign-in for customers, so the edge lets every request through and the shop
# decides. Staff reach the admin at /app through their Whisk sign-in (/auth/whisk). The website's
# forms (the CMS's form blocks, /forms/*) pass the edge's challenge first, so robots cannot fill them.
routes:
  public: ["/**"]
  challenge: ["/forms/*"]

# The business's own admin, which the Whisk bar links for its team: the shop's admin, and the
# site editor opened at the page being looked at (src/api/middlewares.ts).
admin:
  path: /app
  edit: "/cms/edit?path={path}"

health:
  path: /health/ready
  timeout: 60

database: app
migrate: "node migrate.js"

kv: true
storage: true
email: true

# Bank transfer needs no keys. Each other way to pay is on once its secrets are declared here
# and set (README, Take payments); a deploy waits for every declared secret's value.
secrets: []

env:
  # The port of this machine the editor (cms/) answers on, inside the app only (src/lib/cms.ts).
  CMS_PORT: "9100"
  # The editor is part of a shop: it offers product pages and the products block (cms/src/app.ts).
  CMS_SHOP: "1"
  # The business's time zone for the times the editor shows, such as enquiries (cms/src/admin/data.ts).
  SITE_TIME_ZONE: "UTC"
  STRIPE_CAPTURE: automatic
  WINDCAVE_ENVIRONMENT: live
  WINDCAVE_CAPTURE: automatic
  PAYPAL_ENVIRONMENT: live
  PAYPAL_CAPTURE: automatic
  SHOP_EMAIL_FROM: ""
  # Where each new order is emailed, comma separated; empty sends none (src/lib/notify.ts).
  SHOP_ORDERS_TO: ""
