whisk: 1
name: whisk-shop

# The shop has its own sign-in for customers, so the edge lets every request through and the shop
# decides. Staff reach the admin at /app through their Whisk sign-in (/auth/whisk). The website's
# forms (the CMS's form blocks, /forms/*) pass the edge's challenge first, so robots cannot fill them.
routes:
  public: ["/**"]
  challenge: ["/forms/*"]

# The business's own admin, which the Whisk bar links for its team: the shop's admin, the site
# editor opened at the page being looked at (route.go), and the list of what the
# business still has to give before the shop takes orders (Whisk's commerce engine keeps it),
# which whisk deploy prints and the bar points at with Finish setup.
admin:
  path: /app
  edit: "/cms/edit?path={path}"
  setup: /admin/whisk/setup

health:
  path: /health/ready
  timeout: 60

# The shop's API is Medusa's (/store, /admin, /auth, /hooks), and Whisk's commerce engine answers
# it on the app's database; this app serves the shop's pages (main.go).
commerce: medusa

database: app
migrate: "node migrate.js"

storage: true
email: true

# Bank transfer needs no keys. Each other way to pay is on once its secrets are declared here
# and set (README, Take payments); a deploy waits for every declared secret's value.
secrets: []

env:
  # The port of this machine the editor (cms/) answers on, inside the app only (editor.go).
  CMS_PORT: "9100"
  # Where the pages read content when the editor runs elsewhere (Whisk's content engine); empty,
  # the server starts the editor in cms/ and reads it on CMS_PORT (editor.go).
  CMS_URL: ""
  # The markets the shop sells in, one domain each ("nz=example.co.nz, au=example.com.au"); empty,
  # it sells in one (README, Sell in several countries).
  SHOP_MARKETS: ""
  # The port of this machine the shop's pages answer on beside an engine inside the app (a
  # preview), which passes them every request that is not the API (main.go).
  SHOP_FRONT_PORT: "9102"
  # The editor is part of a shop: it offers product pages and the products block (cms/src/app.ts).
  CMS_SHOP: "1"
  # The business's time zone for the times the editor shows, such as enquiries (cms/src/admin/data.ts).
  SITE_TIME_ZONE: "UTC"
  STRIPE_CAPTURE: automatic
  WINDCAVE_ENVIRONMENT: live
  WINDCAVE_CAPTURE: automatic
  PAYPAL_ENVIRONMENT: live
  PAYPAL_CAPTURE: automatic
  SHOP_EMAIL_FROM: ""
  # More addresses told of each new order, comma separated, beside those in the shop's setup in
  # the admin.
  SHOP_ORDERS_TO: ""
